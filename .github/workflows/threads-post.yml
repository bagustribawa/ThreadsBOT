name: Threads Auto Post

on:
  schedule:
    # Jam dalam UTC. Konversi dari WITA (UTC+8):
    # 08:00 WITA -> 00:00 UTC
    # 12:30 WITA -> 04:30 UTC
    # 19:00 WITA -> 11:00 UTC
    # 21:30 WITA -> 13:30 UTC
    - cron: "0 0 * * *"
    - cron: "30 4 * * *"
    - cron: "0 11 * * *"
    - cron: "30 13 * * *"
  workflow_dispatch: {}  # supaya bisa di-trigger manual dari tab Actions untuk testing

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Post to Threads
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python post_once.py

